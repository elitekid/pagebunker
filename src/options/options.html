<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>PageBunker</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <h1 data-i18n="settingsTitle">Settings</h1>

  <fieldset>
    <legend data-i18n="readingOptions">Reading</legend>
    <label>
      <input type="checkbox" id="autoMarkRead" checked>
      <span data-i18n="autoMarkRead">Mark as read when I reach the end</span>
    </label>
    <p class="hint" data-i18n="autoMarkReadHint">Requires scrolling and a few seconds on the page.</p>
  </fieldset>

  <fieldset>
    <legend data-i18n="imageOptions">Images</legend>
    <label>
      <input type="checkbox" id="showImagesDefault">
      <span data-i18n="showImagesDefault">Show images by default</span>
    </label>
    <p class="hint" data-i18n="showImagesDefaultHint">When off, images load only when you tap Show images in a article.</p>
  </fieldset>

  <fieldset>
    <legend data-i18n="backupOptions">Backup</legend>
    <label>
      <input type="checkbox" id="autoFileBackup">
      <span data-i18n="autoFileBackup">Automatic file backup</span>
    </label>
    <p class="hint" data-i18n="autoFileBackupHint">Saves a backup file to your Downloads folder.</p>
    <button type="button" id="btn-manual-backup" class="btn" data-i18n="manualBackup">Export full backup</button>
    <p class="hint" data-i18n="manualBackupHint">Download all articles as a backup file.</p>
  </fieldset>

  <p><a href="../library/library.html" data-i18n="openLibrary">Open library</a></p>

  <button id="btn-save" type="button" class="btn primary" data-i18n="save">Save</button>
  <p id="status" role="status" aria-live="polite"></p>

  <script type="module" src="options.js"></script>
</body>
</html>
