<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>PageBunker</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="library.css">
</head>
<body>
  <header class="library-top">
    <div class="library-top-in">
      <h1 data-i18n="libraryTitle">Library</h1>
      <div class="library-top-actions">
        <input type="search" id="search" class="search-input" data-i18n-placeholder="searchPlaceholder" data-i18n-aria="searchPlaceholder">
        <button type="button" id="btn-import" class="btn" data-i18n="importBtn">Import</button>
        <button type="button" id="btn-restore-undo" class="btn hidden" data-i18n="restoreUndoReplace">Undo replace restore</button>
        <button type="button" id="btn-export" class="btn" data-i18n="exportBtn">Export</button>
        <button type="button" id="btn-settings" class="btn" data-i18n="settings">Settings</button>
      </div>
    </div>
    <div class="library-backup">
      <div class="library-backup-lines" aria-live="polite">
        <p id="backup-line-snapshot" class="backup-status-line"></p>
        <p id="backup-line-file" class="backup-status-line"></p>
      </div>
      <div class="library-backup-actions">
        <button type="button" id="btn-backup-now" class="btn" data-i18n="backupNow">Back up now</button>
        <button type="button" id="btn-backup-restore" class="btn" data-i18n="backupRestoreFromFile">Restore from backup file</button>
      </div>
      <p id="backup-restore-hint" class="backup-hint hidden" data-i18n="backupRestoreHint"></p>
    </div>
  </header>

  <div id="toast" class="app-toast hidden" role="status" aria-live="polite"></div>

  <div id="review-banner" class="review-banner hidden" role="status" aria-live="polite">
    <p id="review-banner-text" class="review-banner-text" data-i18n="reviewPromptBody"></p>
    <div class="review-banner-actions">
      <button type="button" id="btn-review-write" class="btn primary" data-i18n="reviewWrite">Write a review</button>
      <button type="button" id="btn-review-dismiss" class="btn" data-i18n="reviewDismiss">Not now</button>
      <a id="link-review-report" class="review-banner-link" href="#" target="_blank" rel="noopener" data-i18n="reportProblem">Report a problem</a>
    </div>
  </div>

  <div id="import-resume" class="import-resume hidden"></div>

  <div class="toolbar">
    <select id="sort">
      <option value="newest" data-i18n="sortNewest">Newest</option>
      <option value="oldest" data-i18n="sortOldest">Oldest</option>
      <option value="shortest" data-i18n="sortShortest">Shortest</option>
    </select>
    <select id="tag-filter">
      <option value="" data-i18n="allTags">All tags</option>
    </select>
    <button type="button" id="btn-select-mode" class="btn" data-i18n="selectMode">Select</button>
  </div>

  <nav class="tabs" role="tablist">
    <button type="button" class="tab active" data-tab="unread" data-i18n="tabUnread">To read</button>
    <button type="button" class="tab" data-tab="read" data-i18n="tabRead">Read</button>
    <button type="button" class="tab" data-tab="archive" data-i18n="tabArchive">Archive</button>
    <button type="button" class="tab" data-tab="trash" data-i18n="tabTrash">Trash</button>
  </nav>

  <div id="selection-bar" class="selection-bar hidden">
    <span id="selection-count"></span>
    <button type="button" id="btn-sel-read" class="btn" data-i18n="markRead">Mark read</button>
    <button type="button" id="btn-sel-archive" class="btn" data-i18n="moveArchive">Archive</button>
    <button type="button" id="btn-sel-trash" class="btn" data-i18n="moveTrash">Delete</button>
    <button type="button" id="btn-sel-restore" class="btn hidden" data-i18n="restore">Restore</button>
    <button type="button" id="btn-sel-tags" class="btn" data-i18n="addTags">Add tags</button>
    <button type="button" id="btn-sel-export" class="btn" data-i18n="exportBtn">Export</button>
    <button type="button" id="btn-sel-cancel" class="btn" data-i18n="cancelSelect">Cancel</button>
  </div>

  <main class="main">
    <p id="loading" class="library-loading" data-i18n="libraryLoading">Loading library…</p>
    <div id="empty-state" class="empty-state-panel hidden">
      <p class="empty-state-title" data-i18n="libraryEmptyTitle">No saved articles yet</p>
      <p class="empty-state-body" data-i18n="libraryEmptyBody"></p>
      <button type="button" id="btn-import-empty" class="btn" data-i18n="popupImportLink">Import from Pocket or Instapaper</button>
    </div>
    <p id="search-nomatch" class="empty-nomatch hidden" data-i18n="popupNoMatch">No articles match your search</p>
    <ul id="list" class="article-list"></ul>
    <button type="button" id="btn-load-more" class="btn hidden" data-i18n="loadMore">Load more</button>
  </main>

  <dialog id="import-dialog">
    <form method="dialog">
      <h2 data-i18n="importTitle">Import</h2>
      <input type="file" id="import-file" accept=".csv,.html,.htm,.txt,.json" hidden>
      <div id="import-preview" class="import-preview"></div>
      <div class="dialog-actions">
        <button type="button" id="btn-import-apply" class="btn primary" data-i18n="importApply">Import</button>
        <button type="button" id="btn-restore-merge" class="btn hidden" data-i18n="restoreMerge">Merge restore</button>
        <button type="button" id="btn-restore-replace" class="btn danger hidden" data-i18n="restoreReplace">Replace restore</button>
        <button type="button" id="btn-import-undo" class="btn hidden" data-i18n="importUndo">Undo import</button>
        <button value="cancel" class="btn" data-i18n="cancel">Cancel</button>
      </div>
    </form>
  </dialog>

  <dialog id="tag-dialog">
    <form method="dialog">
      <h2 data-i18n="addTags">Add tags</h2>
      <input type="text" id="tag-input" class="search-input" data-i18n-placeholder="tagPlaceholder" placeholder="tag1, tag2">
      <div class="dialog-actions">
        <button type="button" id="btn-tag-apply" class="btn primary" data-i18n="apply">Apply</button>
        <button value="cancel" class="btn" data-i18n="cancel">Cancel</button>
      </div>
    </form>
  </dialog>

  <dialog id="file-pick-dialog" class="confirm-dialog" aria-labelledby="file-pick-title">
    <p id="file-pick-title" class="confirm-title"></p>
    <p id="file-pick-body" class="confirm-note"></p>
    <div class="dialog-actions">
      <button id="btn-file-pick" type="button" class="btn primary" data-i18n="filePickBtn">Choose file</button>
      <button id="btn-file-pick-cancel" type="button" class="btn" data-i18n="cancel">Cancel</button>
    </div>
  </dialog>

  <dialog id="export-dialog">
    <form method="dialog">
      <h2 id="export-title">Export</h2>
      <label><input type="radio" name="export-format" value="html" checked> <span data-i18n="exportHtml">HTML (one file)</span></label>
      <label><input type="radio" name="export-format" value="markdown"> <span data-i18n="exportMarkdown">Markdown (per article)</span></label>
      <div class="dialog-actions">
        <button type="button" id="btn-export-apply" class="btn primary" data-i18n="exportBtn">Export</button>
        <button value="cancel" class="btn" data-i18n="cancel">Cancel</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirm-dialog" class="confirm-dialog">
    <form method="dialog">
      <p id="confirm-message"></p>
      <div class="dialog-actions">
        <button type="button" id="btn-confirm-yes" class="btn primary" data-i18n="confirmYes">Yes</button>
        <button value="cancel" class="btn" data-i18n="cancel" autofocus>Cancel</button>
      </div>
    </form>
  </dialog>

  <input type="file" id="file-input" accept=".csv,.html,.htm,.txt,.json" hidden>

  <script type="module" src="library.js"></script>
</body>
</html>
